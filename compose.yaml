
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: task_manager
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmanager -d task_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: "postgres://taskmanager:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/task_manager?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
